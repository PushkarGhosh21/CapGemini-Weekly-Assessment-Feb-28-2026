<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Dashboard</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 50px; background: #f4f7f6; }
        .box { background: white; padding: 30px; border-radius: 10px; display: inline-block; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        h1 { color: #10b981; }
        a { color: #4f46e5; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="box">
        <h1>Login Successful!</h1>
        <p>Welcome to your personal student portal.</p>
        <hr>
        <p><a th:href="@{/auth}">Logout</a></p>
    </div>
</body>
</html>
